name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradedocs
          POSTGRES_PASSWORD: tradedocs
          POSTGRES_DB: tradedocs_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradedocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tradedocs:tradedocs@127.0.0.1:55432/tradedocs_test
      DATABASE_URL: postgresql://tradedocs:tradedocs@127.0.0.1:55432/tradedocs_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y default-jdk-headless
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
