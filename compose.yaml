services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradedocs
      POSTGRES_PASSWORD: tradedocs
      POSTGRES_DB: tradedocs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedocs"]
      interval: 5s
      timeout: 3s
      retries: 10
  test-db:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradedocs
      POSTGRES_PASSWORD: tradedocs
      POSTGRES_DB: tradedocs_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedocs"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
